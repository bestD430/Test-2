<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公車到站預計時間</title>
  <style>
    /* 全局樣式重置與背景 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #1a2130;
      color: #ffffff;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* 頂部資訊欄（天氣與時間） */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    /* 左側天氣 */
    .weather-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .weather-temp {
      background-color: #162c46;
      border: 1px solid #2a4365;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .weather-status {
      background-color: #162c46;
      border: 1px solid #2a4365;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #93c5fd;
      width: fit-content;
    }

    /* 右側時間與日期 */
    .time-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .clock {
      display: flex;
      align-items: baseline;
      font-size: 2.5rem;
      font-weight: bold;
      line-height: 1;
    }

    .clock .ampm-sec {
      display: flex;
      flex-direction: column;
      font-size: 0.75rem;
      margin-left: 4px;
      line-height: 1.1;
      color: #94a3b8;
    }

    /* 核心修復：強制日期單行橫寫 */
    .date-text {
      white-space: nowrap; /* 禁止換行/直向堆疊 */
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 6px;
      flex-shrink: 0;      /* 防止被壓縮 */
    }

    /* 卡片區塊 */
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .title-tag {
      background-color: #3b2506;
      color: #f97316;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .setting-btn {
      background-color: #334155;
      color: #cbd5e1;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .card {
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .card-orange { background-color: #d97706; }
    .card-yellow { background-color: #ca8a04; }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .route-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .company-tag {
      background-color: #78350f;
      color: #fef3c7;
      font-size: 0.7rem;
      padding: 2px 4px;
      border-radius: 3px;
    }

    .route-name {
      font-size: 1.8rem;
      font-weight: 900;
      color: #ffffff;
    }

    .card-yellow .route-name { color: #000000; }

    .destination {
      font-size: 0.85rem;
      font-weight: bold;
      color: #fef3c7;
    }

    .card-yellow .destination { color: #1c1917; }

    .card-body {
      display: flex;
      gap: 8px;
    }

    .status-badge {
      flex: 1.2;
      background-color: #064e3b;
      color: #34d399;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .time-slot {
      flex: 1;
      background-color: #0f172a;
      color: #94a3b8;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- 頁首：天氣與日期時間 -->
  <div class="header">
    <div class="weather-box">
      <div class="weather-temp">☀️ 29°C</div>
      <div class="weather-status">☀️ 天氣良好</div>
    </div>
    
    <div class="time-box">
      <div class="clock">
        1:16
        <div class="ampm-sec">
          <span>下午</span>
          <span>:38</span>
        </div>
      </div>
      <!-- 關鍵修正點：套用 .date-text 的 white-space: nowrap -->
      <div class="date-text">2026年9月4日 星期五</div>
    </div>
  </div>

  <!-- 巴士預計到站時間區塊 -->
  <div class="section-title">
    <span class="title-tag">🚌 巴士到站預計時間</span>
    <button class="setting-btn">⚙️ 路線設定</button>
  </div>

  <!-- E36A 卡片 -->
  <div class="card card-orange">
    <div class="card-header">
      <div class="route-info">
        <span class="company-tag">龍運</span>
        <span class="route-name">E36A</span>
      </div>
      <div class="destination">東涌 ➔ 往元朗</div>
    </div>
    <div class="card-body">
      <div class="status-badge">暫無班次</div>
      <div class="time-slot">-</div>
      <div class="time-slot">-</div>
    </div>
  </div>

  <!-- E33 卡片 -->
  <div class="card card-yellow">
    <div class="card-header">
      <div class="route-info">
        <span class="company-tag" style="background-color: #451a03; color: #fde047;">城巴</span>
        <span class="route-name">E33</span>
      </div>
      <div class="destination">屯門 ➔ 往 機場/東涌</div>
    </div>
    <div class="card-body">
      <div class="status-badge">暫無班次</div>
      <div class="time-slot">-</div>
      <div class="time-slot">-</div>
    </div>
  </div>

</body>
</html>

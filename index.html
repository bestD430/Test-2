<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>逸東邨雍逸樓 (TC188) 響應式巴士到站時間</title>
  <style>
    :root {
      --bg: #0a0e17;
      --card-bg: #0d1424;
      --border: #1a2538;
      --radius: 14px;
      --gap: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: #fff;
      min-height: 100vh;
      padding: 12px;
      line-height: 1.4;
    }

    .board {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.55);
      border: 1px solid var(--border);
      transition: max-width 0.3s ease;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 10px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bus-icon {
      width: 28px;
      height: 28px;
      background: #fff;
      color: #0d1424;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
    }

    .stop-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .settings {
      font-size: 20px;
      opacity: 0.65;
    }

    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 18px 16px;
      border-bottom: 1px solid var(--border);
    }

    .weather {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .weather-icon { font-size: 22px; }

    .temp {
      font-size: 19px;
      font-weight: 600;
    }

    .weather-desc {
      font-size: 12px;
      opacity: 0.8;
    }

    .time-block { text-align: right; }

    .time {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .date {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 2px;
    }

    .routes {
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--gap);
    }

    .route-card {
      display: flex;
      border-radius: var(--radius);
      overflow: hidden;
      min-height: 90px;
    }

    .route-left {
      width: 88px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 6px;
      flex-shrink: 0;
    }

    .company {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .route-no {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.1;
    }

    .route-right {
      flex: 1;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .dest-main {
      font-size: 13px;
      font-weight: 500;
    }

    .dest-to {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 2px;
    }

    .times {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      margin-top: 6px;
    }

    .time-main {
      font-size: 24px;
      font-weight: 800;
    }

    .time-sub {
      font-size: 13px;
      font-weight: 600;
      opacity: 0.9;
    }

    .red .route-left   { background: #c62828; }
    .red .route-right  { background: #8b1a1a; }
    .red .time-main,
    .red .time-sub     { color: #69f0ae; }

    .orange .route-left  { background: #ef6c00; }
    .orange .route-right { background: #b34d00; }
    .orange .time-main,
    .orange .time-sub    { color: #ff8a80; }

    .yellow .route-left  { background: #f9a825; color: #1a1a1a; }
    .yellow .route-right { background: #c17900; }
    .yellow .time-main,
    .yellow .time-sub    { color: #fff; }

    .green .route-left   { background: #2e7d32; }
    .green .route-right  { background: #1b5e20; }
    .green .time-main,
    .green .time-sub     { color: #ff8a80; }

    .footer {
      text-align: center;
      padding: 12px;
      font-size: 11px;
      opacity: 0.4;
    }

    /* 響應式：平板兩欄 */
    @media (min-width: 768px) {
      body { padding: 24px; }
      .board { max-width: 780px; }
      .stop-name { font-size: 20px; }
      .time { font-size: 30px; }
      .routes {
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 18px;
      }
      .route-left { width: 100px; }
      .route-no { font-size: 30px; }
      .time-main { font-size: 26px; }
      .company { font-size: 15px; }
    }

    /* 響應式：桌機更大 */
    @media (min-width: 1100px) {
      .board { max-width: 1100px; }
      .header { padding: 20px 24px 12px; }
      .stop-name { font-size: 22px; }
      .info-bar { padding: 8px 24px 20px; }
      .time { font-size: 34px; }
      .temp { font-size: 22px; }
      .routes {
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        padding: 22px;
      }
      .route-card { min-height: 110px; }
      .route-left { width: 110px; }
      .route-no { font-size: 34px; }
      .company { font-size: 16px; }
      .dest-main { font-size: 15px; }
      .dest-to { font-size: 13px; }
      .time-main { font-size: 28px; }
      .time-sub { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="board">
    <div class="header">
      <div class="header-left">
        <div class="bus-icon">🚌</div>
        <div class="stop-name">逸東邨雍逸樓 (TC188)</div>
      </div>
      <div class="settings">⚙</div>
    </div>

    <div class="info-bar">
      <div class="weather">
        <div class="weather-icon">🌙</div>
        <div>
          <div class="temp">29°C</div>
          <div class="weather-desc">天氣良好</div>
        </div>
      </div>
      <div class="time-block">
        <div class="time">7:01 下午</div>
        <div class="date">2026年9月13日 星期日</div>
      </div>
    </div>

    <div class="routes">
      <div class="route-card red">
        <div class="route-left">
          <div class="company">九巴</div>
          <div class="route-no">E31</div>
        </div>
        <div class="route-right">
          <div>
            <div class="dest-main">逸東邨雍逸樓 (TC188)</div>
            <div class="dest-to">往荃灣 (愉景新城)</div>
          </div>
          <div class="times">
            <div class="time-main">14 分鐘</div>
            <div class="time-sub">34 分鐘</div>
            <div class="time-sub">54 分鐘</div>
          </div>
        </div>
      </div>

      <div class="route-card orange">
        <div class="route-left">
          <div class="company">龍運</div>
          <div class="route-no">E36A</div>
        </div>
        <div class="route-right">
          <div>
            <div class="dest-main">逸東邨雍逸樓 (TC188)</div>
            <div class="dest-to">往元朗 (德業街)</div>
          </div>
          <div class="times">
            <div class="time-main">1 分鐘</div>
            <div class="time-sub">30 分鐘</div>
            <div class="time-sub">-</div>
          </div>
        </div>
      </div>

      <div class="route-card yellow">
        <div class="route-left">
          <div class="company">城巴</div>
          <div class="route-no">E21B</div>
        </div>
        <div class="route-right">
          <div>
            <div class="dest-main">逸東邨雍逸樓, 裕東路</div>
            <div class="dest-to">往何文田 (愛民邨)</div>
          </div>
          <div class="times">
            <div class="time-main">無班次</div>
            <div class="time-sub">-</div>
            <div class="time-sub">-</div>
          </div>
        </div>
      </div>

      <div class="route-card green">
        <div class="route-left">
          <div class="company">嶼巴</div>
          <div class="route-no">39M</div>
        </div>
        <div class="route-right">
          <div>
            <div class="dest-main">逸東邨雍逸樓</div>
            <div class="dest-to">東涌站巴士總站 > 滿東邨 (循環線)</div>
          </div>
          <div class="times">
            <div class="time-main">將到站</div>
            <div class="time-sub">15 分鐘</div>
            <div class="time-sub">30 分鐘</div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">響應式設計示範 · 巴士到站預計時間僅供參考</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>即時交通資訊看板</title>
<style>
  :root {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent-blue: #38bdf8;
    --status-green: #22c55e;
    --status-yellow: #eab308;
    --status-red: #ef4444;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
    padding: 24px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow: hidden;
  }

  /* 頂部列：看板標題與時間 */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card-bg);
    padding: 16px 32px;
    border-radius: 12px;
    border-left: 6px solid var(--accent-blue);
  }

  .title-group h1 {
    font-size: 28px;
    letter-spacing: 1px;
  }

  .title-group p {
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 4px;
  }

  /* 直排 上午/下午 時間元件 */
  .clock-container {
    display: flex;
    align-items: center;
    font-family: "Courier New", monospace, sans-serif;
  }

  .ampm-vertical {
    font-size: 20px;            /* 相對於 40px 時間縮小 50% */
    writing-mode: vertical-rl; /* 文字直排 */
    text-orientation: upright;/* 保持字體正向 */
    line-height: 1;
    letter-spacing: 2px;
    color: var(--accent-blue);
    margin-right: 8px;
    font-weight: bold;
  }

  .time-digits {
    font-size: 40px;
    font-weight: bold;
    letter-spacing: 2px;
  }

  /* 主要內容區塊 Grid 排版 */
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    flex: 1;
  }

  .board-card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
  }

  .board-card h2 {
    font-size: 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--accent-blue);
    border-bottom: 1px solid #334155;
    padding-bottom: 10px;
  }

  /* 表格樣式 */
  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }

  th {
    color: var(--text-muted);
    font-size: 14px;
    padding: 12px 8px;
    border-bottom: 1px solid #334155;
  }

  td {
    padding: 16px 8px;
    font-size: 18px;
    border-bottom: 1px solid #1e293b;
  }

  tr:hover {
    background-color: #334155;
  }

  /* 狀態標籤 */
  .badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    display: inline-block;
  }

  .badge-arriving {
    background-color: rgba(239, 68, 68, 0.2);
    color: var(--status-red);
    border: 1px solid var(--status-red);
    animation: pulse 1.5s infinite;
  }

  .badge-approaching {
    background-color: rgba(234, 179, 8, 0.2);
    color: var(--status-yellow);
    border: 1px solid var(--status-yellow);
  }

  .badge-normal {
    background-color: rgba(34, 197, 94, 0.2);
    color: var(--status-green);
    border: 1px solid var(--status-green);
  }

  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
  }
</style>
</head>
<body>

  <!-- 頁頂看板資訊與時間 -->
  <header>
    <div class="title-group">
      <h1>台北車站 綜合交通資訊看板</h1>
      <p id="current-date">載入中...</p>
    </div>
    
    <!-- 時間顯示（包含直排縮小的上午/下午） -->
    <div class="clock-container">
      <div id="ampm" class="ampm-vertical">上午</div>
      <div id="time" class="time-digits">00:00:00</div>
    </div>
  </header>

  <!-- 主要看板區域 -->
  <main>
    <!-- 公車動態看板 -->
    <section class="board-card">
      <h2>🚌 公車即時到站資訊</h2>
      <table>
        <thead>
          <tr>
            <th>路線</th>
            <th>目的地</th>
            <th>預估到站</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>307</strong></td>
            <td>板橋公車站</td>
            <td><span class="badge badge-arriving">即將進站</span></td>
          </tr>
          <tr>
            <td><strong>299</strong></td>
            <td>輔大</td>
            <td><span class="badge badge-approaching">2 分鐘</span></td>
          </tr>
          <tr>
            <td><strong>652</strong></td>
            <td>新莊高中</td>
            <td><span class="badge badge-normal">7 分鐘</span></td>
          </tr>
          <tr>
            <td><strong>265</strong></td>
            <td>土城</td>
            <td><span class="badge badge-normal">12 分鐘</span></td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- 捷運/鐵路時刻看板 -->
    <section class="board-card">
      <h2>🚇 捷運 / 鐵路近期班次</h2>
      <table>
        <thead>
          <tr>
            <th>線路</th>
            <th>終點站</th>
            <th>發車時間</th>
            <th>狀態</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>板南線</td>
            <td>頂埔</td>
            <td>10:32</td>
            <td><span class="badge badge-normal">準點</span></td>
          </tr>
          <tr>
            <td>淡水信義線</td>
            <td>淡水</td>
            <td>10:35</td>
            <td><span class="badge badge-normal">準點</span></td>
          </tr>
          <tr>
            <td>台鐵自強號</td>
            <td>高雄</td>
            <td>10:40</td>
            <td><span class="badge badge-approaching">晚 3 分</span></td>
          </tr>
          <tr>
            <td>高鐵 615 次</td>
            <td>左營</td>
            <td>10:51</td>
            <td><span class="badge badge-normal">準點</span></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script>
    function updateClock() {
      const now = new Date();
      
      // 更新日期
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      document.getElementById('current-date').textContent = now.toLocaleDateString('zh-TW', options);

      // 計算上午 / 下午
      const hours = now.getHours();
      const ampmText = hours >= 12 ? '下午' : '上午';
      document.getElementById('ampm').textContent = ampmText;

      // 格式化 12 小時制時間
      const displayHours = String(hours % 12 || 12).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      document.getElementById('time').textContent = `${displayHours}:${minutes}:${seconds}`;
    }

    // 初始化與每秒更新
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
